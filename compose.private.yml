services:
  agent-reach-mcp:
    build: .
    restart: unless-stopped
    environment:
      AGENT_REACH_MCP_TRANSPORT: streamable-http
      AGENT_REACH_MCP_AUTH_MODE: none
      AGENT_REACH_MCP_HOST: 0.0.0.0
      AGENT_REACH_MCP_PORT: 8080
      # The container listens on all container interfaces so Docker can publish
      # the port, but the host publish below is loopback-only. This explicit
      # override acknowledges that the container network itself is not the
      # authentication boundary.
      AGENT_REACH_MCP_ALLOW_INSECURE_REMOTE: "true"
    ports:
      - "127.0.0.1:8080:8080"
