[project]
name = "agent-reach-mcp"
version = "0.1.0"
description = "Remote MCP gateway for Agent Reach, designed for ChatGPT and other MCP clients."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "morio-23"}]
keywords = ["mcp", "agent-reach", "chatgpt", "remote-mcp", "ai-agent"]
dependencies = [
  "agent-reach>=1.5.0,<2",
  "mcp[cli]>=2.2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.12"]

[project.scripts]
agent-reach-mcp = "agent_reach_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reach_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
